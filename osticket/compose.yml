services:
  osticket:
    image: rinkp/osticket-dockerized:1.18.3
    container_name: osticket
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      OST_SECRET_SALT: ${INSTALL_SECRET}
      OST_ADMIN_EMAIL: admin@example.com
      OST_ADMIN_PASSWD: ${ADMIN_PASSWORD}
      OST_HELPDESK_URL: http://192.168.1.10:8080/
      OST_DBHOST: db:3306
      OST_DBNAME: osticket
      OST_DBUSER: osticket
      OST_DBPASS: ${DB_PASSWORD}
    ports:
      - "192.168.1.10:8080:80"

  db:
    image: mariadb:10.11
    container_name: osticket-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: osticket
      MYSQL_USER: osticket
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./db:/var/lib/mysql