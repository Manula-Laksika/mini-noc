#!/usr/sbin/nft -f
# Home server firewall. Own table only: never flush the whole ruleset,
# Docker and Tailscale manage their own tables.

table inet homefw
delete table inet homefw

table inet homefw {
    chain input {
        type filter hook input priority 0; policy drop;

        ct state invalid drop
        ct state established,related accept
        iifname "lo" accept

        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
        ip6 nexthdr icmpv6 accept

        iifname "tailscale0" accept
        udp dport 41641 accept
        iifname "enp1s0" udp sport 68 udp dport 67 accept

        iifname "enp1s0" ip saddr 192.168.1.0/24 tcp dport 22 accept
        iifname "enp1s0" ip saddr 192.168.1.0/24 udp dport 53 accept
        iifname "enp1s0" ip saddr 192.168.1.0/24 tcp dport { 53, 80, 443 } accept
        # Docker bridge networks (Uptime Kuma checks) - only the ports it monitors
        iifname "br-*" ip saddr 172.16.0.0/12 tcp dport { 22, 53, 80 } accept
        iifname "br-*" ip saddr 172.16.0.0/12 udp dport 53 accept

        limit rate 5/minute log prefix "homefw-drop: "
    }
}

